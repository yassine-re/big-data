services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.25.2
    container_name: eds-clickhouse
    restart: unless-stopped

    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-bronze}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-eds_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Copier .env.example vers .env et définir CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"

    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client
          --user "$$CLICKHOUSE_USER"
          --password "$$CLICKHOUSE_PASSWORD"
          --query "SELECT 1"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

    networks:
      - eds-network

  lake-loader:
    profiles:
      - tools
    network_mode: none
    build:
      context: ./pipeline
    environment:
      SOURCE_ROOT: /app/source-filestorage
      LAKE_ROOT: /app/lake
      HMAC_PATIENT_SECRET: ${HMAC_PATIENT_SECRET:?Définir HMAC_PATIENT_SECRET dans .env}
      HMAC_STAY_SECRET: ${HMAC_STAY_SECRET:?Définir HMAC_STAY_SECRET dans .env}
    volumes:
      - ./source-filestorage:/app/source-filestorage:ro
      - ./lake:/app/lake

volumes:
  clickhouse-data:
  clickhouse-logs:

networks:
  eds-network:
    name: eds-network
